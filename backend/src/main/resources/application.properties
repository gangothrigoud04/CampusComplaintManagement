server.port=8080
server.shutdown=graceful
spring.application.name=Campus Complaint and Resolution Management System
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_complaint_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-department.name=${INITIAL_DEPARTMENT_NAME:}
app.upload.directory=${UPLOAD_DIR:./uploads}
app.sla.hours.urgent=${SLA_HOURS_URGENT:4}
app.sla.hours.high=${SLA_HOURS_HIGH:24}
app.sla.hours.medium=${SLA_HOURS_MEDIUM:72}
app.sla.hours.low=${SLA_HOURS_LOW:120}
app.sla.due-soon-percent=${SLA_DUE_SOON_PERCENT:20}
app.sla.escalation-check-ms=${SLA_ESCALATION_CHECK_MS:60000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
